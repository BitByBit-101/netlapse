# nginx config for running netlapse directly on a host/VM (no Docker).
#
# Install to:
#   /etc/nginx/sites-available/netlapse   (then symlink into sites-enabled/)
# or on Amazon Linux / RHEL:
#   /etc/nginx/conf.d/netlapse.conf
#
# Assumes:
#   - `npm run build` output copied to /var/www/netlapse
#   - the Go binary running on 127.0.0.1:8080 (see deploy/netlapse.service)
#
# For HTTPS, run `certbot --nginx -d netlapse.example.com` AFTER this file is
# in place — certbot rewrites the server block in-place to add the TLS listener
# and a port-80 redirect, so there is no need to hand-write either here.

server {
    listen 80;
    listen [::]:80;

    # Replace with your domain, or leave as _ to answer on the bare IP.
    server_name _;

    root /var/www/netlapse;
    index index.html;

    access_log /var/log/nginx/netlapse.access.log;
    error_log  /var/log/nginx/netlapse.error.log;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Reverse proxy to the Go server bound on loopback. Binding the API to
    # 127.0.0.1 rather than 0.0.0.0 means nginx is the only way in, so the
    # plain-HTTP Go listener is never exposed to the internet.
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
