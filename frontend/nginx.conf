# nginx config used INSIDE the frontend container (docker compose).
# For running nginx directly on a host/VM, see deploy/nginx-host.conf.

upstream netlapse_api {
    # "backend" is the compose service name, resolved by Docker's internal DNS.
    server backend:8080;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite emits content-hashed filenames, so these can never go stale.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The API. Proxied under the same origin as the app, which is why the
    # frontend is built with an empty VITE_API_URL and requests relative paths:
    # one origin means no CORS preflights and no hard-coded backend hostname
    # baked into the JS bundle.
    #
    # No trailing slash on proxy_pass — the backend matches on the full
    # /api/... path (see api.NewRouter), so the URI must be passed through
    # unmodified.
    location /api/ {
        proxy_pass http://netlapse_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /api/investigate can call out to an LLM, which is slower than a
        # normal DB read. The default 60s would cut a cold model load short.
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
    }

    # index.html must not be cached, or a browser keeps loading an old build
    # that references deleted asset hashes.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # The app uses hash routing (#/app), so deep links never hit the server as
    # real paths. This fallback is here so that stays true even if the routing
    # ever moves to the History API.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
